<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This pizza is still in the oven — TJ’s Italian Café</title>
<meta name="robots" content="noindex">
<style>
  :root{ --cream:#FBF8F1; --navy:#14242F; --ink:#1C2B36; --gold:#BE9A4E; --gold-lt:#E3C97F; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    text-align:center;padding:32px 20px;}
  .wrap{max-width:560px}
  .pie{width:min(300px,76vw);height:min(300px,76vw);object-fit:cover;border-radius:50%;
    border:4px solid rgba(227,201,127,0.45);box-shadow:0 26px 64px rgba(0,0,0,.55);
    margin:0 auto 30px;display:block;background:#0d171e;}
  .code{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-lt);margin:0 0 10px;font-weight:700}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0 0 16px}
  p{font-size:clamp(16px,2.4vw,18px);color:rgba(251,248,241,.82);line-height:1.6;margin:0 0 30px}
  a.btn{display:inline-block;background:var(--gold);color:var(--navy);text-decoration:none;
    font-weight:700;padding:14px 28px;border-radius:999px;font-size:16px;min-height:48px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);transition:background .15s,transform .1s;}
  a.btn:hover{background:var(--gold-lt)}
  a.btn:active{transform:translateY(1px)}
  a.btn:focus-visible{outline:3px solid var(--gold-lt);outline-offset:3px}
</style>
</head>
<body>
  <main class="wrap">
    <video class="pie" src="/assets/tj-pizza.mp4" poster="/assets/chef-tj.jpg"
           autoplay muted loop playsinline aria-label="TJ tossing a pizza"></video>
    <p class="code">404</p>
    <h1>This pizza is still in the oven.</h1>
    <p>That page isn’t on the menu — but dinner’s ready back home.</p>
    <a class="btn" href="/">← Back to TJ’s Italian Café</a>
  </main>
</body>
</html>
